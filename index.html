<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>兒童醫學骨骼學習館</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  Arial,"Noto Sans TC",sans-serif;
  background:#f2f7fb;
  color:#29465b;
}

button{
  font-family:inherit;
}

/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(135deg,#1769aa,#42a5f5);
  color:white;
  text-align:center;
  padding:24px 16px 28px;
}

header h1{
  margin:0;
  font-size:28px;
  font-weight:800;
}

header .english{
  margin-top:7px;
  font-size:18px;
  font-weight:700;
}

header .subtitle{
  margin-top:10px;
  font-size:14px;
  line-height:1.7;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:920px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:22px;
  box-shadow:0 5px 20px rgba(33,80,120,.08);
}

.section-title{
  font-size:25px;
  font-weight:850;
  color:#17618e;
  margin:0 0 15px;
}

.section-note{
  color:#607d8b;
  font-size:14px;
  line-height:1.7;
  margin:0 0 18px;
}

/* =========================
   四大區
========================= */

.region-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
  margin-bottom:20px;
}

.region-btn{
  border:none;
  border-radius:18px;
  padding:18px 10px;
  background:#e8f3fc;
  color:#17618e;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.region-btn.active{
  background:#1976d2;
  color:white;
}

/* =========================
   學習區
========================= */

.learn-panel{
  display:none;
}

.learn-panel.active{
  display:block;
}

/* =========================
   頭部視角
========================= */

.skull-tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:5px 0 17px;
}

.skull-tab{
  border:none;
  border-radius:18px;
  padding:12px 22px;
  font-size:17px;
  font-weight:800;
  color:#17618e;
  background:#e4f0fa;
  cursor:pointer;
}

.skull-tab.active{
  color:#fff;
  background:#1976d2;
}

.skull-view{
  display:none;
}

.skull-view.active{
  display:block;
}

/* =========================
   骨骼圖共用
========================= */

.diagram{
  position:relative;
  width:100%;
  height:620px;
  border:2px solid #e1edf5;
  border-radius:22px;
  overflow:hidden;
  background:#fff;
}

.diagram img{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  max-height:92%;
  max-width:55%;
  object-fit:contain;
}

/* =========================
   英文標籤
========================= */

.bone-label{
  position:absolute;
  z-index:5;
  border:none;
  background:white;
  color:#1f2d33;

  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  font-style:italic;
  font-weight:700;

  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
}

.bone-label:hover,
.bone-label.speaking{
  color:#1976d2;
  background:#eef7ff;
}

.bone-label small{
  display:block;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  Arial,"Noto Sans TC",sans-serif;
  font-size:11px;
  font-style:normal;
  color:#78909c;
  margin-top:2px;
}

/* =========================
   指示線
========================= */

.bone-label.left::after,
.bone-label.right::after{
  content:"";
  position:absolute;
  top:50%;
  width:var(--line);
  border-top:2px dashed #7f8c8d;
}

.bone-label.left::after{
  left:100%;
}

.bone-label.right::after{
  right:100%;
}

/* =========================
   頭部圖大小
========================= */

.skull-diagram img{
  max-width:54%;
  max-height:88%;
}

/* =========================
   胸腹部圖
========================= */

.trunk-diagram img{
  max-width:46%;
  max-height:91%;
}

/* =========================
   上肢圖
========================= */

.upper-diagram img{
  max-width:54%;
  max-height:90%;
}

/* =========================
   下肢圖
========================= */

.lower-diagram img{
  max-width:47%;
  max-height:93%;
}

/* =========================
   複習卡
========================= */

.review-title{
  font-size:25px;
  color:#17618e;
  margin:0 0 16px;
}

.review-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.review-card{
  border:2px solid #dceaf3;
  border-radius:18px;
  padding:17px;
}

.review-cn{
  font-size:17px;
  font-weight:800;
  margin-bottom:7px;
}

.review-en{
  border:none;
  background:none;
  color:#1976d2;
  font-size:17px;
  font-weight:800;
  padding:0;
  cursor:pointer;
}

/* =========================
   QUIZ
========================= */

.quiz-box{
  text-align:center;
}

.quiz-question{
  font-size:20px;
  font-weight:800;
  margin:15px 0;
}

.quiz-options{
  display:grid;
  gap:10px;
}

.quiz-option{
  border:none;
  border-radius:15px;
  background:#eaf4fb;
  padding:14px;
  font-size:17px;
  font-weight:700;
  color:#245675;
}

.quiz-result{
  min-height:30px;
  margin-top:14px;
  font-weight:800;
}

.next-btn{
  width:100%;
  margin-top:10px;
  border:none;
  border-radius:17px;
  padding:15px;
  background:#1976d2;
  color:white;
  font-size:17px;
  font-weight:800;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:5px 20px 30px;
  color:#78909c;
  font-size:13px;
}

/* =========================
   手機
========================= */

@media(max-width:650px){

  .container{
    padding:12px;
  }

  .card{
    padding:15px 10px;
  }

  .diagram{
    height:520px;
  }

  .bone-label{
    font-size:12px;
    padding:4px;
  }

  .bone-label small{
    font-size:9px;
  }

  .skull-diagram img{
    max-width:52%;
  }

  .trunk-diagram img{
    max-width:44%;
  }

  .upper-diagram img{
    max-width:49%;
  }

  .lower-diagram img{
    max-width:43%;
  }

  .review-grid{
    grid-template-columns:1fr 1fr;
  }

  .region-btn{
    font-size:16px;
    padding:15px 7px;
  }

  .bone-label.left::after,
  .bone-label.right::after{
    width:var(--mline);
  }

}

@media(max-width:390px){

  .diagram{
    height:490px;
  }

  .bone-label{
    font-size:11px;
  }

}

</style>
</head>

<script>

/* =========================
   英文發音
========================= */

function speak(text,element){

  if(!("speechSynthesis" in window)){
    alert("這個瀏覽器目前不支援語音功能");
    return;
  }

  window.speechSynthesis.cancel();

  document
  .querySelectorAll(".speaking")
  .forEach(function(el){
    el.classList.remove("speaking");
  });

  if(element){
    element.classList.add("speaking");
  }

  const utterance=
  new SpeechSynthesisUtterance(text);

  utterance.lang="en-US";
  utterance.rate=0.78;
  utterance.pitch=1;

  utterance.onend=function(){

    if(element){
      element.classList.remove("speaking");
    }

  };

  window.speechSynthesis.speak(utterance);

}


/* =========================
   四區切換
========================= */

function showRegion(id,button){

  document
  .querySelectorAll(".learn-panel")
  .forEach(function(panel){
    panel.classList.remove("active");
  });

  document
  .querySelectorAll(".region-grid .region-btn")
  .forEach(function(btn){
    btn.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  button.classList.add("active");

}


/* =========================
   頭骨正側背面
========================= */

function showSkull(id,button){

  document
  .querySelectorAll(".skull-view")
  .forEach(function(view){
    view.classList.remove("active");
  });

  document
  .querySelectorAll(".skull-tab")
  .forEach(function(tab){
    tab.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  button.classList.add("active");

}


/* =========================
   QUIZ
========================= */

const quizData=[

{
q:"額骨的英文是？",
correct:"Frontal bone",
options:[
"Frontal bone",
"Temporal bone",
"Femur"
]
},

{
q:"頂骨的英文是？",
correct:"Parietal bone",
options:[

]
},

{
q:"胸骨的英文是？",

options:[

]
},

{
q:"肋骨的英文是？",
correct:"Ribs",
options:[
"Radius",

"Fibula"
]
},

{
q:"肱骨的英文是？",
correct:"Humerus",
options:[
"Humerus",
"Femur",
"Tibia"
]
},

{
q:"橈骨的英文是？",
correct:"Radius",
options:[

]
},

{
q:"尺骨的英文是？",
correct:"Ulna",
options:[
"Fibula",

"Femur"
]
},

{
q:"股骨的英文是？",
correct:"Femur",
options:[
"Tibia",

"Radius"
]
},

{
q:"髕骨的英文是？",
correct:"Patella",
options:[

"Clavicle"
]
},

{
q:"脛骨的英文是？",
correct:"Tibia",
options:[

"Fibula",
"Humerus"
]
}

];


let currentQuiz=0;


function loadQuestion(){

  const item=
  quizData[currentQuiz];

  document
  .getElementById("quizQuestion")
  .textContent=item.q;

  document
  .getElementById("quizResult")
  .textContent="";

  const optionBox=
  document.getElementById("quizOptions");

  optionBox.innerHTML="";


  item.options.forEach(function(option){

    const button=
    document.createElement("button");

    button.className="quiz-option";

    button.textContent=option;


    button.onclick=function(){

      speak(option);

      if(option===item.correct){

        document
        .getElementById("quizResult")
        .textContent=
        "✅ 答對了！";

      }else{

        document
        .getElementById("quizResult")
        .textContent=
        "❌ 再想想看，正確答案是 "
        +item.correct;

      }

    };


    optionBox.appendChild(button);

  });

}


function nextQuestion(){

  currentQuiz++;

  if(currentQuiz>=quizData.length){

    currentQuiz=0;

  }

  loadQuestion();

}


loadQuestion();
