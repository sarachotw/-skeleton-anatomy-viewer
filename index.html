<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>兒童醫學骨骼學習館</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    "Noto Sans TC",
    sans-serif;
  background:#f4f8fc;
  color:#243447;
}

/* =========================
   頂部
========================= */

header{
  background:linear-gradient(135deg,#1769aa,#42a5f5);
  color:white;
  text-align:center;
  padding:28px 18px 30px;
}

header h1{
  margin:0;
  font-size:29px;
}

header .english{
  margin-top:8px;
  font-size:18px;
  font-weight:600;
}

header .subtitle{
  margin-top:12px;
  font-size:15px;
  opacity:.95;
  line-height:1.7;
}

/* =========================
   主體
========================= */

.container{
  width:min(100%,960px);
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:
    0 6px 25px rgba(30,80,130,.09);
}

.section-title{
  text-align:center;
  margin:0 0 7px;
  color:#155a93;
  font-size:23px;
}

.section-subtitle{
  text-align:center;
  color:#63778a;
  margin:0 0 18px;
  font-size:14px;
  line-height:1.7;
}

/* =========================
   首頁人體骨架
========================= */

.hero-skeleton{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:470px;
  border-radius:18px;
  background:
    linear-gradient(#ffffff,#f7fbff);
  padding:15px;
}

.hero-skeleton img{
  max-height:455px;
  max-width:100%;
  object-fit:contain;
}

/* =========================
   四大分類
========================= */

.region-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.region-button{
  border:none;
  background:#edf7ff;
  border:2px solid #d4ebff;
  border-radius:18px;
  padding:17px 10px;
  cursor:pointer;
  transition:.2s;
  color:#164f7a;
}

.region-button:active{
  transform:scale(.97);
}

.region-icon{
  font-size:31px;
}

.region-cn{
  font-size:18px;
  font-weight:700;
  margin-top:5px;
}

.region-en{
  font-size:13px;
  margin-top:4px;
  color:#5481a4;
}

/* =========================
   學習區
========================= */

#learningArea{
  display:none;
}

.back-button{
  border:none;
  background:#e7f3ff;
  color:#1769aa;
  border-radius:999px;
  padding:10px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:15px;
}

.region-heading{
  text-align:center;
}

.region-heading h2{
  color:#155a93;
  font-size:25px;
  margin:4px 0;
}

.region-heading .regionEnglish{
  color:#698297;
  font-size:16px;
  margin-bottom:16px;
}

/* =========================
   主醫學圖
========================= */

.anatomy-viewer{
  background:#fbfdff;
  border:1px solid #e2edf6;
  border-radius:20px;
  padding:15px;
  text-align:center;
}

.anatomy-image-wrap{
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.anatomy-image-wrap img{
  max-height:460px;
  max-width:100%;
  object-fit:contain;
}

.view-buttons{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-bottom:14px;
  flex-wrap:wrap;
}

.view-btn{
  border:none;
  border-radius:999px;
  background:#e9f3fc;
  color:#245f8b;
  font-weight:700;
  padding:9px 15px;
  cursor:pointer;
}

.view-btn.active{
  background:#1976d2;
  color:white;
}

.image-note{
  color:#718596;
  font-size:12px;
  line-height:1.6;
  margin-top:10px;
}

/* =========================
   骨頭卡片
========================= */

.bone-title{
  margin:25px 0 13px;
  color:#194f78;
  font-size:19px;
}

.bone-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.bone-card{
  background:#fff;
  border:1px solid #ddeaf4;
  border-radius:17px;
  padding:15px 12px;
  cursor:pointer;
  position:relative;
  transition:.2s;
}

.bone-card:active{
  transform:scale(.98);
}

.bone-card.selected{
  border:2px solid #2196f3;
  background:#eef8ff;
}

.bone-cn{
  font-size:17px;
  font-weight:700;
  color:#25465f;
}

.bone-en-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-top:7px;
}

.bone-en{
  color:#1976d2;
  font-weight:700;
  font-size:15px;
}

.speak-btn{
  width:37px;
  height:37px;
  border-radius:50%;
  border:none;
  background:#e4f2ff;
  color:#1565c0;
  font-size:19px;
  cursor:pointer;
}

/* =========================
   詳細資料
========================= */

.detail-box{
  display:none;
  background:#f1f8fe;
  border-left:5px solid #42a5f5;
  border-radius:15px;
  padding:17px;
  margin-top:18px;
}

.detail-box.show{
  display:block;
}

.detail-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.detail-title h3{
  margin:0;
  color:#174e78;
  font-size:21px;
}

.detail-english{
  font-size:17px;
  color:#1976d2;
  font-weight:700;
  margin-top:5px;
}

.detail-text{
  margin-top:13px;
  line-height:1.8;
  color:#465d6e;
  font-size:15px;
}

.tip{
  background:#fff8df;
  border-radius:13px;
  padding:12px;
  margin-top:13px;
  font-size:14px;
  color:#745b1a;
}

/* =========================
   發音提示
========================= */

.speech-status{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  padding:10px 18px;
  background:rgba(25,50,70,.9);
  color:white;
  border-radius:999px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

.speech-status.show{
  opacity:1;
}

/* =========================
   手機
========================= */

@media(max-width:600px){

  header h1{
    font-size:25px;
  }

  .container{
    padding:13px;
  }

  .card{
    padding:16px;
    border-radius:18px;
  }

  .hero-skeleton{
    min-height:390px;
  }

  .hero-skeleton img{
    max-height:380px;
  }

  .anatomy-image-wrap{
    min-height:270px;
  }

  .anatomy-image-wrap img{
    max-height:390px;
  }

  .bone-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .bone-cn{
    font-size:16px;
  }

  .bone-en{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>

  <h1>🦴 兒童醫學骨骼學習館</h1>

  <div class="english">
    Human Skeleton Learning
  </div>

  <div class="subtitle">
    看真正的骨頭・學英文名稱・聽正確發音
  </div>

</header>


<div class="container">

<!-- =========================
     首頁
========================= -->

<section id="homeArea">

  <div class="card">

    <h2 class="section-title">
      認識人體骨骼
    </h2>

    <p class="section-subtitle">
      成人骨骼通常有 206 塊骨頭。<br>
      選一個身體區域開始學習吧！
    </p>

    <div class="hero-skeleton">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Human_skeleton_front_no-text_no-color.svg"
        alt="人體骨骼"
      >

    </div>


    <div class="region-grid">

      <button
        class="region-button"
        onclick="openRegion('head')"
      >

        <div class="region-icon">💀</div>

        <div class="region-cn">
          頭部
        </div>

        <div class="region-en">
          Skull
        </div>

      </button>


      <button
        class="region-button"
        onclick="openRegion('trunk')"
      >

        <div class="region-icon">🫁</div>

        <div class="region-cn">
          胸腹部
        </div>

        <div class="region-en">
          Trunk
        </div>

      </button>


      <button
        class="region-button"
        onclick="openRegion('upper')"
      >

        <div class="region-icon">🦾</div>

        <div class="region-cn">
          上肢
        </div>

        <div class="region-en">
          Upper Limb
        </div>

      </button>


      <button
        class="region-button"
        onclick="openRegion('lower')"
      >

        <div class="region-icon">🦿</div>

        <div class="region-cn">
          下肢
        </div>

        <div class="region-en">
          Lower Limb
        </div>

      </button>

    </div>

  </div>

</section>


<!-- =========================
     學習畫面
========================= -->

<section id="learningArea">

  <div class="card">

    <button
      class="back-button"
      onclick="goHome()"
    >
      ← 回到人體骨骼
    </button>


    <div class="region-heading">

      <h2 id="regionTitle">
        頭部
      </h2>

      <div
        class="regionEnglish"
        id="regionEnglish"
      >
        Skull
      </div>

    </div>


    <div class="anatomy-viewer">

      <div
        class="view-buttons"
        id="viewButtons"
      >
      </div>


      <div class="anatomy-image-wrap">

        <img
          id="regionImage"
          src=""
          alt=""
        >

      </div>

      <div
        class="image-note"
        id="imageNote"
      >
      </div>

    </div>


    <h3 class="bone-title">
      點一塊骨頭開始學習 👇
    </h3>


    <div
      class="bone-grid"
      id="boneGrid"
    >
    </div>


    <div
      class="detail-box"
      id="detailBox"
    >

      <div class="detail-title">

        <div>

          <h3 id="detailCN">
          </h3>

          <div
            class="detail-english"
            id="detailEN"
          >
          </div>

        </div>

        <button
          class="speak-btn"
          id="detailSpeak"
        >
          🔊
        </button>

      </div>


      <div
        class="detail-text"
        id="detailText"
      >
      </div>


      <div
        class="tip"
        id="detailTip"
      >
      </div>

    </div>

  </div>

</section>

</div>


<div
  class="speech-status"
  id="speechStatus"
>
</div>


<script>

/* ==========================================
   骨骼資料
========================================== */

const regions = {


/* =========================
   頭部
========================= */

head:{

  title:"頭部骨骼",

  english:"Skull",

  views:[

    {
      name:"正面",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_skull_front_bones.svg"
    },

    {
      name:"側面",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_skull_side_simplified_(bones).svg"
    }

  ],

  note:
  "頭骨由多塊骨頭組成。不同顏色代表不同骨頭，方便辨認位置。",

  bones:[

    {
      cn:"額骨",
      en:"Frontal bone",
      text:
      "位在額頭的位置，也是眼眶上方的重要骨頭。",
      tip:
      "記憶：Frontal 就像 Front，代表前面。"
    },

    {
      cn:"頂骨",
      en:"Parietal bone",
      text:
      "位在頭頂與頭部兩側，是顱骨的重要部分。",
      tip:
      "左右各有一塊頂骨。"
    },

    {
      cn:"顳骨",
      en:"Temporal bone",
      text:
      "位在頭部兩側、耳朵附近。",
      tip:
      "摸摸耳朵上方的位置，就是顳骨附近。"
    },

    {
      cn:"枕骨",
      en:"Occipital bone",
      text:
      "位在頭顱後方與底部。",
      tip:
      "摸摸後腦勺，可以幫助記住 Occipital bone。"
    },

    {
      cn:"顴骨",
      en:"Zygomatic bone",
      text:
      "就是我們常說的顴骨，形成臉頰外側與部分眼眶。",
      tip:
      "笑一笑時，臉頰高起來的地方附近就是顴骨。"
    },

    {
      cn:"鼻骨",
      en:"Nasal bone",
      text:
      "兩塊小骨頭形成鼻樑上方的骨性部分。",
      tip:
      "Nasal 就是「鼻子的」。"
    },

    {
      cn:"上顎骨",
      en:"Maxilla",
      text:
      "形成上顎，並固定上排牙齒。",
      tip:
      "Maxilla = 上顎骨。"
    },

    {
      cn:"下顎骨",
      en:"Mandible",
      text:
      "形成下巴與下顎，是頭骨中主要可以活動的骨頭。",
      tip:
      "張開嘴巴時，下顎骨會跟著移動。"
    }

  ]

},


/* =========================
   胸腹部
========================= */

trunk:{

  title:"胸腹部骨骼",

  english:"Trunk",

  views:[

    {
      name:"胸廓",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Thoracic_Cage_with_Spine_-_Anatomy.gif"
    },

    {
      name:"全身位置",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_skeleton_front_no-text_no-color.svg"
    }

  ],

  note:
  "胸廓由肋骨、胸骨與胸椎共同形成，可以保護心臟與肺。",

  bones:[

    {
      cn:"胸骨",
      en:"Sternum",
      text:
      "位在胸部正中央的扁平骨，肋骨透過肋軟骨與它相連。",
      tip:
      "Sternum = 胸骨。"
    },

    {
      cn:"肋骨",
      en:"Ribs",
      text:
      "人體通常有 12 對肋骨，共 24 根。",
      tip:
      "Rib 是一根肋骨；Ribs 是多根肋骨。"
    },

    {
      cn:"脊柱",
      en:"Vertebral column",
      text:
      "由一連串椎骨組成，是人體軀幹的重要支柱。",
      tip:
      "Vertebral column 也常稱 Spine。"
    },

    {
      cn:"頸椎",
      en:"Cervical vertebrae",
      text:
      "位於頸部，共有 7 節。",
      tip:
      "Cervical = 頸部的。"
    },

    {
      cn:"胸椎",
      en:"Thoracic vertebrae",
      text:
      "位在胸部，共有 12 節，並與肋骨相連。",
      tip:
      "Thoracic = 胸部的。"
    },

    {
      cn:"腰椎",
      en:"Lumbar vertebrae",
      text:
      "位於下背部，共有 5 節，是承重的重要椎骨。",
      tip:
      "Lumbar = 腰部的。"
    },

    {
      cn:"薦骨",
      en:"Sacrum",
      text:
      "位在脊柱最下方、骨盆後側，由數個椎骨融合形成。",
      tip:
      "Sacrum 位在骨盆中央偏後方。"
    },

    {
      cn:"尾骨",
      en:"Coccyx",
      text:
      "位於脊柱最末端，是小型融合骨。",
      tip:
      "Coccyx 就是尾骨。"
    }

  ]

},


/* =========================
   上肢
========================= */

upper:{

  title:"上肢骨骼",

  english:"Upper Limb",

  views:[

    {
      name:"上肢骨",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_arm_bones_diagram.svg"
    },

    {
      name:"全身位置",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_skeleton_front_no-text_no-color.svg"
    }

  ],

  note:
  "上肢包括肩帶、上臂、前臂、手腕與手部骨骼。",

  bones:[

    {
      cn:"鎖骨",
      en:"Clavicle",
      text:
      "位在胸前上方，連接胸骨與肩胛骨。",
      tip:
      "摸摸脖子下方，可以摸到鎖骨。"
    },

    {
      cn:"肩胛骨",
      en:"Scapula",
      text:
      "位在上背部，是一塊扁平、近似三角形的骨頭。",
      tip:
      "Scapula = 肩胛骨。"
    },

    {
      cn:"肱骨",
      en:"Humerus",
      text:
      "從肩膀延伸到手肘，是上臂唯一的長骨。",
      tip:
      "Humerus 是上臂的大骨頭。"
    },

    {
      cn:"橈骨",
      en:"Radius",
      text:
      "前臂的兩根長骨之一，位於拇指側。",
      tip:
      "伸出大拇指：拇指這一側是 Radius。"
    },

    {
      cn:"尺骨",
      en:"Ulna",
      text:
      "前臂的另一根長骨，位於小指側。",
      tip:
      "小指這一側是 Ulna。"
    },

    {
      cn:"腕骨",
      en:"Carpals",
      text:
      "位於手腕，由多塊小骨頭組成。",
      tip:
      "Carpals = 手腕骨。"
    },

    {
      cn:"掌骨",
      en:"Metacarpals",
      text:
      "形成手掌主要骨架，共有 5 根。",
      tip:
      "Meta + carpals，可以聯想到腕骨前方的掌骨。"
    },

    {
      cn:"指骨",
      en:"Phalanges",
      text:
      "形成手指的骨頭。",
      tip:
      "Phalanges 同時也是腳趾骨的英文名稱。"
    }

  ]

},


/* =========================
   下肢
========================= */

lower:{

  title:"下肢骨骼",

  english:"Lower Limb",

  views:[

    {
      name:"下肢骨",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_leg_bones_labeled.svg"
    },

    {
      name:"全身位置",
      image:
      "https://commons.wikimedia.org/wiki/Special:FilePath/Human_skeleton_front_no-text_no-color.svg"
    }

  ],

  note:
  "下肢負責支撐身體重量、站立、走路、跑步與跳躍。",

  bones:[

    {
      cn:"骨盆",
      en:"Pelvis",
      text:
      "位在軀幹下方，是連接脊柱與下肢的重要骨性結構。",
      tip:
      "Pelvis = 骨盆。"
    },

    {
      cn:"股骨",
      en:"Femur",
      text:
      "位於大腿，是人體最長、非常強壯的骨頭。",
      tip:
      "Femur = 大腿骨。這一個英文很重要！"
    },

    {
      cn:"髕骨",
      en:"Patella",
      text:
      "位在膝關節前方，也就是俗稱的膝蓋骨。",
      tip:
      "Patella = 膝蓋骨。"
    },

    {
      cn:"脛骨",
      en:"Tibia",
      text:
      "小腿較粗、主要承受重量的長骨。",
      tip:
      "摸小腿前方硬硬的骨頭，主要就是 Tibia。"
    },

    {
      cn:"腓骨",
      en:"Fibula",
      text:
      "位在小腿外側，比脛骨細。",
      tip:
      "Tibia 粗、Fibula 細。"
    },

    {
      cn:"跗骨",
      en:"Tarsals",
      text:
      "位於腳踝與足後部，由多塊骨頭組成。",
      tip:
      "Tarsals = 足部靠近腳踝的小骨頭。"
    },

    {
      cn:"蹠骨",
      en:"Metatarsals",
      text:
      "形成腳掌主要骨架，共有 5 根。",
      tip:
      "Metatarsals 對應手掌的 Metacarpals。"
    },

    {
      cn:"趾骨",
      en:"Phalanges",
      text:
      "形成腳趾的骨頭。",
      tip:
      "手指骨和腳趾骨都叫 Phalanges。"
    }

  ]

}

};


/* ==========================================
   開啟區域
========================================== */

let currentRegion = null;

function openRegion(key){

  currentRegion = key;

  const data = regions[key];

  document.getElementById("homeArea").style.display =
  "none";

  document.getElementById("learningArea").style.display =
  "block";

  document.getElementById("regionTitle").textContent =
  data.title;

  document.getElementById("regionEnglish").textContent =
  data.english;

  document.getElementById("imageNote").textContent =
  data.note;

  buildViews(data);

  buildBones(data);

  document.getElementById("detailBox")
  .classList.remove("show");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   圖片切換
========================================== */

function buildViews(data){

  const buttons =
  document.getElementById("viewButtons");

  buttons.innerHTML = "";

  data.views.forEach((view,index)=>{

    const button =
    document.createElement("button");

    button.className =
    "view-btn" +
    (index === 0 ? " active" : "");

    button.textContent =
    view.name;

    button.onclick = function(){

      document
      .querySelectorAll(".view-btn")
      .forEach(b=>
        b.classList.remove("active")
      );

      button.classList.add("active");

      setImage(view.image);

    };

    buttons.appendChild(button);

  });

  setImage(data.views[0].image);

}


function setImage(url){

  const image =
  document.getElementById("regionImage");

  image.style.opacity = ".3";

  image.onload = function(){
    image.style.opacity = "1";
  };

  image.src = url;

}


/* ==========================================
   建立骨頭清單
========================================== */

function buildBones(data){

  const grid =
  document.getElementById("boneGrid");

  grid.innerHTML = "";

  data.bones.forEach((bone,index)=>{

    const card =
    document.createElement("div");

    card.className =
    "bone-card";

    card.innerHTML = `

      <div class="bone-cn">
        ${bone.cn}
      </div>

      <div class="bone-en-row">

        <div class="bone-en">
          ${bone.en}
        </div>

        <button
          class="speak-btn"
          aria-label="播放 ${bone.en} 發音"
        >
          🔊
        </button>

      </div>
    `;


    /* 點卡片 */

    card.addEventListener(
      "click",
      function(){

        selectBone(
          bone,
          card
        );

      }
    );


    /* 點喇叭 */

    const speakButton =
    card.querySelector(".speak-btn");

    speakButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        speakEnglish(
          bone.en
        );

      }
    );


    grid.appendChild(card);

  });

}


/* ==========================================
   顯示骨頭介紹
========================================== */

function selectBone(
  bone,
  card
){

  document
  .querySelectorAll(".bone-card")
  .forEach(item=>
    item.classList.remove("selected")
  );

  card.classList.add("selected");


  document.getElementById(
    "detailCN"
  ).textContent =
  bone.cn;


  document.getElementById(
    "detailEN"
  ).textContent =
  bone.en;


  document.getElementById(
    "detailText"
  ).textContent =
  bone.text;


  document.getElementById(
    "detailTip"
  ).textContent =
  "💡 " + bone.tip;


  const detail =
  document.getElementById(
    "detailBox"
  );

  detail.classList.add(
    "show"
  );


  document.getElementById(
    "detailSpeak"
  ).onclick =
  function(){

    speakEnglish(
      bone.en
    );

  };


  setTimeout(()=>{

    detail.scrollIntoView({
      behavior:"smooth",
      block:"nearest"
    });

  },100);

}


/* ==========================================
   英文發音
========================================== */

function speakEnglish(text){

  if(
    !("speechSynthesis" in window)
  ){

    alert(
      "這個瀏覽器目前不支援語音播放。"
    );

    return;

  }


  window.speechSynthesis.cancel();


  const speech =
  new SpeechSynthesisUtterance(
    text
  );


  speech.lang =
  "en-US";


  speech.rate =
  0.78;


  speech.pitch =
  1;


  speech.volume =
  1;


  /*
    iPhone Safari
    優先尋找英文聲音
  */

  const voices =
  window.speechSynthesis
  .getVoices();


  const englishVoice =
  voices.find(
    voice =>
    voice.lang === "en-US"
  )
  ||
  voices.find(
    voice =>
    voice.lang.startsWith("en")
  );


  if(englishVoice){

    speech.voice =
    englishVoice;

  }


  showSpeechStatus(
    "🔊 " + text
  );


  window.speechSynthesis
  .speak(speech);

}


/* ==========================================
   播放提示
========================================== */

let speechTimer = null;

function showSpeechStatus(text){

  const box =
  document.getElementById(
    "speechStatus"
  );

  box.textContent =
  text;

  box.classList.add(
    "show"
  );


  clearTimeout(
    speechTimer
  );


  speechTimer =
  setTimeout(()=>{

    box.classList.remove(
      "show"
    );

  },1400);

}


/* ==========================================
   回首頁
========================================== */

function goHome(){

  window.speechSynthesis.cancel();

  document.getElementById(
    "learningArea"
  ).style.display =
  "none";

  document.getElementById(
    "homeArea"
  ).style.display =
  "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   iPhone Safari 預先載入聲音
========================================== */

if(
  "speechSynthesis" in window
){

  window.speechSynthesis
  .getVoices();

  window.speechSynthesis
  .onvoiceschanged =
  function(){

    window.speechSynthesis
    .getVoices();

  };

}

</script>
