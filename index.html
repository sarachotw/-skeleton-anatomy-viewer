/* =========================

  display:none;
}

  display:block;
}

========================= */

.diagram{

  width:100%;
  height:620px;
  border:2px solid #e1edf5;
  border-radius:22px;
  overflow:hidden;
  background:#fff;
}

.diagram img{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  max-height:92%;
  max-width:94%;
  object-fit:contain;
  display:block;
}

/* =========================
   透明英文點擊區
========================= */

.hotspot{
  position:absolute;
  z-index:20;
  border:none;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.hotspot:focus,
.hotspot:active{
  outline:none;
  background:transparent;
}

/* =========================

========================= */

.skull-diagram img{

/* =========================

/* =========================

/* =========================

<script>

/* =========================
   英文發音
========================= */

function speak(text,element){

  if(!("speechSynthesis" in window)){
    alert("這個瀏覽器目前不支援語音功能");
    return;
  }

  window.speechSynthesis.cancel();

  document
  .querySelectorAll(".speaking")
  .forEach(function(el){
    el.classList.remove("speaking");
  });

  if(element){
    element.classList.add("speaking");
  }

  const utterance=
  new SpeechSynthesisUtterance(text);

  utterance.lang="en-US";
  utterance.rate=0.78;
  utterance.pitch=1;
  utterance.volume=1;

  const voices=
  window.speechSynthesis.getVoices();

  const englishVoice=
  voices.find(function(v){
    return v.lang==="en-US";
  }) ||
  voices.find(function(v){
    return v.lang && v.lang.startsWith("en");
  });

  if(englishVoice){
    utterance.voice=englishVoice;
  }

  utterance.onend=function(){

    if(element){
      element.classList.remove("speaking");
    }

  };

  window.speechSynthesis.speak(utterance);

}

if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged=function(){
    window.speechSynthesis.getVoices();
  };
}


/* =========================
   四區切換
========================= */

function showRegion(id,button){

  document
  .querySelectorAll(".learn-panel")
  .forEach(function(panel){
    panel.classList.remove("active");
  });

  document
  .querySelectorAll(".region-grid .region-btn")
  .forEach(function(btn){
    btn.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  button.classList.add("active");

}


/* =========================
   頭骨正側背面
========================= */

function showSkull(id,button){

  document
  .querySelectorAll(".skull-view")
  .forEach(function(view){
    view.classList.remove("active");
  });

  document
  .querySelectorAll(".skull-tab")
  .forEach(function(tab){
    tab.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  button.classList.add("active");

}

let currentQuiz=0;


function loadQuestion(){

  const item=
  quizData[currentQuiz];

  document
  .getElementById("quizQuestion")
  .textContent=item.q;

  document
  .getElementById("quizResult")
  .textContent="";

  const optionBox=
  document.getElementById("quizOptions");

  optionBox.innerHTML="";


  item.options.forEach(function(option){

    const button=
    document.createElement("button");

    button.className="quiz-option";

    button.textContent=option;


    button.onclick=function(){

      speak(option);

      if(option===item.correct){

        document
        .getElementById("quizResult")
        .textContent=
        "✅ 答對了！";

      }else{

        document
        .getElementById("quizResult")
        .textContent=
        "❌ 再想想看，正確答案是 "
        +item.correct;

      }

    };


    optionBox.appendChild(button);

  });

}


function nextQuestion(){

  currentQuiz++;

  if(currentQuiz>=quizData.length){

    currentQuiz=0;

  }

  loadQuestion();

}
