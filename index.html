<!DOCTYPE html> 
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Anatomy Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f8fb;
      text-align: center;
      color: #243447;
    }

    header {
      background: #1e88e5;
      color: white;
      padding: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .skeleton {
      font-size: 85px;
      margin: 20px 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      background: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    button:hover {
      background: #e3f2fd;
    }

    #info {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      min-height: 100px;
    }

    #boneName {
      color: #1976d2;
      font-size: 26px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🦴 Skeleton Anatomy Viewer</h1>
  <div class="subtitle">點選骨頭，認識人體骨骼</div>
</header>

<div class="container">

  <div class="skeleton">💀</div>

  <div class="buttons">

    <button onclick="showBone('skull')">💀 頭骨</button>

    <button onclick="showBone('spine')">🦴 脊椎</button>

    <button onclick="showBone('ribs')">🫁 肋骨</button>

    <button onclick="showBone('pelvis')">🦴 骨盆</button>

    <button onclick="showBone('humerus')">💪 肱骨</button>

    <button onclick="showBone('femur')">🦵 股骨</button>

    <button onclick="showBone('patella')">🦵 膝蓋骨</button>

    <button onclick="showBone('tibia')">🦴 脛骨</button>

  </div>

  <div id="info">
    <div id="boneName">歡迎！</div>
    <div id="boneText">
      點選上面的骨頭名稱，就可以開始學習人體骨骼。
    </div>
  </div>

</div>

<script>

const bones = {

  skull: {
    name: "頭骨 Skull",
    text: "頭骨保護我們的大腦，也形成臉部的基本結構。"
  },

  spine: {
    name: "脊椎 Spine",
    text: "脊椎由許多椎骨組成，可以支撐身體並保護脊髓。"
  },

  ribs: {
    name: "肋骨 Ribs",
    text: "肋骨形成胸廓，可以保護心臟和肺。"
  },

  pelvis: {
    name: "骨盆 Pelvis",
    text: "骨盆連接脊椎與雙腿，並支撐身體的重量。"
  },

  humerus: {
    name: "肱骨 Humerus",
    text: "肱骨是上臂最大的骨頭，位於肩膀和手肘之間。"
  },

  femur: {
    name: "股骨 Femur",
    text: "股骨是人體最長、最強壯的骨頭，位於大腿。"
  },

  patella: {
    name: "髕骨 Patella",
    text: "髕骨就是我們常說的膝蓋骨，可以保護膝關節。"
  },

  tibia: {
    name: "脛骨 Tibia",
    text: "脛骨是小腿主要承受重量的骨頭。"
  }

};

function showBone(bone) {

  document.getElementById("boneName").innerText =
    bones[bone].name;

  document.getElementById("boneText").innerText =
    bones[bone].text;

}

</script>

</body>
</html>
