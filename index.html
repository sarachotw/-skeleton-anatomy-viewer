<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>兒童醫學骨骼學習館</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans TC",sans-serif;
  background:#f3f8fc;
  color:#243447;
}

button{
  font-family:inherit;
}

/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(135deg,#1769aa,#42a5f5);
  color:white;
  text-align:center;
  padding:25px 15px 27px;
}

header h1{
  margin:0;
  font-size:27px;
}

header .english{
  margin-top:7px;
  font-size:17px;
  font-weight:700;
}

header .subtitle{
  margin-top:9px;
  font-size:14px;
  line-height:1.7;
}

/* =========================
   共用
========================= */

.container{
  width:min(100%,960px);
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 6px 24px rgba(30,80,120,.09);
}

.section-title{
  margin:0;
  text-align:center;
  color:#155a93;
  font-size:23px;
}

.section-subtitle{
  text-align:center;
  color:#637789;
  font-size:14px;
  line-height:1.7;
}

/* =========================
   首頁
========================= */

.hero-skeleton{
  min-height:390px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
}

.hero-skeleton img{
  max-height:390px;
  max-width:100%;
  object-fit:contain;
}

.region-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-top:14px;
}

.region-button{
  border:2px solid #d9eafb;
  background:#f0f8ff;
  border-radius:18px;
  padding:16px 8px;
  color:#165581;
  cursor:pointer;
}

.region-button:active{
  transform:scale(.97);
}

.region-icon{
  font-size:29px;
}

.region-cn{
  margin-top:4px;
  font-size:18px;
  font-weight:800;
}

.region-en{
  margin-top:3px;
  font-size:13px;
  color:#5c819d;
}

/* =========================
   學習頁
========================= */

#learningArea{
  display:none;
}

.back-button{
  border:none;
  background:#e5f2ff;
  color:#1769aa;
  border-radius:999px;
  padding:10px 15px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.region-heading{
  text-align:center;
  margin-top:8px;
}

.region-heading h2{
  color:#155a93;
  margin:5px 0 2px;
  font-size:24px;
}

.region-heading .english{
  color:#647f93;
  font-size:16px;
}

/* =========================
   學習 / 遊戲切換
========================= */

.mode-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:18px 0 13px;
}

.mode-tab{
  border:none;
  border-radius:14px;
  padding:12px 8px;
  font-size:15px;
  font-weight:800;
  background:#eaf4fc;
  color:#326788;
  cursor:pointer;
}

.mode-tab.active{
  background:#1976d2;
  color:#fff;
}

/* =========================
   圖片
========================= */

.viewer{
  background:#fbfdff;
  border:1px solid #dfeaf3;
  border-radius:20px;
  padding:12px;
}

.instructions{
  text-align:center;
  border-radius:13px;
  background:#fff5ce;
  color:#705914;
  padding:10px;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
}

.view-buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}

.view-btn{
  border:none;
  border-radius:999px;
  padding:8px 14px;
  background:#e5f1fb;
  color:#28658f;
  font-weight:800;
  cursor:pointer;
}

.view-btn.active{
  background:#1976d2;
  color:white;
}

/*
  圖片 + 點擊區域
*/

.anatomy-stage{
  position:relative;
  width:min(100%,520px);
  height:510px;
  margin:auto;
  overflow:hidden;
  border-radius:15px;
  background:white;
}

.anatomy-stage img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}

.hotspot{
  position:absolute;
  z-index:10;
  border:2px solid transparent;
  background:transparent;
  border-radius:999px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.hotspot:active,
.hotspot.selected{
  background:rgba(33,150,243,.28);
  border-color:#2196f3;
}

/* =========================
   骨頭答案
========================= */

.answer-box{
  display:none;
  margin-top:12px;
  background:#edf8ff;
  border:2px solid #b9dffb;
  border-radius:18px;
  padding:15px;
  text-align:center;
}

.answer-box.show{
  display:block;
}

.answer-cn{
  color:#294e68;
  font-size:21px;
  font-weight:900;
}

.answer-en-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:3px;
}

.answer-en{
  color:#1565c0;
  font-size:25px;
  font-weight:900;
}

.speak-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#d8efff;
  font-size:20px;
  cursor:pointer;
}

.answer-description{
  margin-top:8px;
  color:#526a7b;
  font-size:14px;
  line-height:1.7;
}

/* =========================
   英文複習卡
========================= */

.review-title{
  margin:23px 0 11px;
  color:#205a80;
  font-size:18px;
}

.bone-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.bone-card{
  background:#fff;
  border:1px solid #dce9f2;
  border-radius:15px;
  padding:12px;
  cursor:pointer;
}

.bone-card:active{
  background:#edf8ff;
}

.bone-card-cn{
  font-size:16px;
  font-weight:800;
}

.bone-card-en{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
  margin-top:5px;
  color:#1976d2;
  font-size:14px;
  font-weight:800;
}

.mini-speak{
  width:32px;
  height:32px;
  border:none;
  background:#e6f3ff;
  border-radius:50%;
  cursor:pointer;
}

/* =========================
   遊戲
========================= */

#gamePanel{
  display:none;
}

.game-box{
  background:#f7fbff;
  border:2px solid #d8ebfa;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  text-align:center;
}

.game-label{
  color:#708497;
  font-size:13px;
}

.game-question{
  margin-top:5px;
  color:#174f77;
  font-size:20px;
  font-weight:900;
}

.game-word{
  margin-top:4px;
  color:#1976d2;
  font-size:28px;
  font-weight:900;
}

.game-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.game-button{
  border:none;
  border-radius:999px;
  background:#1976d2;
  color:white;
  padding:10px 15px;
  font-weight:800;
  cursor:pointer;
}

.game-sound{
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  background:#dcefff;
  font-size:20px;
  cursor:pointer;
}

.game-score{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:12px;
  color:#4e687c;
  font-weight:800;
}

.game-result{
  min-height:28px;
  margin-top:8px;
  font-size:18px;
  font-weight:900;
}

.correct{
  color:#16883e;
}

.wrong{
  color:#d04a3a;
}

/* =========================
   發音提示
========================= */

.speech-status{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  padding:9px 16px;
  color:#fff;
  background:rgba(20,40,60,.92);
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

.speech-status.show{
  opacity:1;
}

/* =========================
   手機
========================= */

@media(max-width:600px){

  header h1{
    font-size:24px;
  }

  .container{
    padding:11px;
  }

  .card{
    padding:14px;
  }

  .hero-skeleton{
    min-height:340px;
  }

  .hero-skeleton img{
    max-height:340px;
  }

  .anatomy-stage{
    height:440px;
  }

  .answer-en{
    font-size:23px;
  }

}
</style>
</head>

<body>

<header>

  <h1>🦴 兒童醫學骨骼學習館</h1>

  <div class="english">
    Human Skeleton Learning
  </div>

  <div class="subtitle">
    點骨頭・看中英文・聽英文發音・玩骨骼小遊戲
  </div>

</header>


<div class="container">

<!-- ==================================================
     首頁
================================================== -->

<section id="homeArea">

  <div class="card">

    <h2 class="section-title">
      認識人體骨骼
    </h2>

    <p class="section-subtitle">
      成人骨骼通常有 206 塊骨頭。<br>
      選一個區域開始學習。
    </p>

    <div class="hero-skeleton">

      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Human%20skeleton%20front%20no-text%20no-color.svg"
        alt="人體骨骼"
      >

    </div>

    <div class="region-grid">

      <button
        class="region-button"
        onclick="openRegion('head')"
      >
        <div class="region-icon">💀</div>
        <div class="region-cn">頭部</div>
        <div class="region-en">Skull</div>
      </button>

      <button
        class="region-button"
        onclick="openRegion('trunk')"
      >
        <div class="region-icon">🩻</div>
        <div class="region-cn">胸腹部</div>
        <div class="region-en">Trunk</div>
      </button>

      <button
        class="region-button"
        onclick="openRegion('upper')"
      >
        <div class="region-icon">🦾</div>
        <div class="region-cn">上肢</div>
        <div class="region-en">Upper Limb</div>
      </button>

      <button
        class="region-button"
        onclick="openRegion('lower')"
      >
        <div class="region-icon">🦿</div>
        <div class="region-cn">下肢</div>
        <div class="region-en">Lower Limb</div>
      </button>

    </div>

  </div>

</section>


<!-- ==================================================
     學習區
================================================== -->

<section id="learningArea">

  <div class="card">

    <button
      class="back-button"
      onclick="goHome()"
    >
      ← 回人體骨骼
    </button>

    <div class="region-heading">

      <h2 id="regionTitle"></h2>

      <div
        class="english"
        id="regionEnglish"
      ></div>

    </div>


    <!-- =========================
         模式
    ========================= -->

    <div class="mode-tabs">

      <button
        id="learnTab"
        class="mode-tab active"
        onclick="setMode('learn')"
      >
        📖 學習模式
      </button>

      <button
        id="gameTab"
        class="mode-tab"
        onclick="setMode('game')"
      >
        🎮 骨頭小遊戲
      </button>

    </div>


    <!-- =========================
         遊戲題目
    ========================= -->

    <div id="gamePanel">

      <div class="game-box">

        <div class="game-label">
          聽英文／看英文，找出正確的骨頭
        </div>

        <div class="game-question">
          請點出：
        </div>

        <div
          class="game-word"
          id="gameWord"
        >
          Femur
        </div>

        <div class="game-controls">

          <button
            class="game-sound"
            onclick="speakGameQuestion()"
          >
            🔊
          </button>

          <button
            class="game-button"
            onclick="nextQuestion()"
          >
            換一題
          </button>

        </div>

        <div class="game-score">

          <span>
            ✅ 答對
            <span id="correctScore">0</span>
          </span>

          <span>
            ⭐ 題數
            <span id="totalScore">0</span>
          </span>

        </div>

        <div
          class="game-result"
          id="gameResult"
        ></div>

      </div>

    </div>


    <!-- =========================
         骨骼圖
    ========================= -->

    <div class="viewer">

      <div
        class="instructions"
        id="instructions"
      >
        👆 直接點圖片上的骨頭
      </div>

      <div
        class="view-buttons"
        id="viewButtons"
      ></div>

      <div
        class="anatomy-stage"
        id="anatomyStage"
      >

        <img
          id="regionImage"
          src=""
          alt="骨骼圖"
        >

      </div>


      <!-- =========================
           點骨頭答案
      ========================= -->

      <div
        class="answer-box"
        id="answerBox"
      >

        <div
          class="answer-cn"
          id="answerCN"
        ></div>

        <div class="answer-en-row">

          <div
            class="answer-en"
            id="answerEN"
          ></div>

          <button
            class="speak-btn"
            id="answerSpeak"
          >
            🔊
          </button>

        </div>

        <div
          class="answer-description"
          id="answerDescription"
        ></div>

      </div>

    </div>


    <!-- =========================
         複習
    ========================= -->

    <div id="reviewArea">

      <h3 class="review-title">
        骨頭英文複習
      </h3>

      <div
        class="bone-grid"
        id="boneGrid"
      ></div>

    </div>

  </div>

</section>

</div>


<div
  class="speech-status"
  id="speechStatus"
></div>

/* ==================================================
   狀態
================================================== */

let currentRegionKey = null;
let currentBone = null;
let mode = "learn";

let gameTarget = null;
let correctScore = 0;
let totalScore = 0;


/* ==================================================
   開啟區域
================================================== */

function openRegion(key){

  currentRegionKey = key;

  const data = regions[key];

  document.getElementById("homeArea")
    .style.display = "none";

  document.getElementById("learningArea")
    .style.display = "block";

  document.getElementById("regionTitle")
    .textContent = data.title;

  document.getElementById("regionEnglish")
    .textContent = data.english;

  document.getElementById("answerBox")
    .classList.remove("show");

  setMode("learn");

  buildViews(data);
  buildHotspots(data);
  buildBoneCards(data);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==================================================
   模式切換
================================================== */

function setMode(newMode){

  mode = newMode;

  const learnTab =
    document.getElementById("learnTab");

  const gameTab =
    document.getElementById("gameTab");

  const gamePanel =
    document.getElementById("gamePanel");

  const reviewArea =
    document.getElementById("reviewArea");

  const instructions =
    document.getElementById("instructions");

  if(mode === "learn"){

    learnTab.classList.add("active");
    gameTab.classList.remove("active");

    gamePanel.style.display = "none";
    reviewArea.style.display = "block";

    instructions.textContent =
      "👆 直接點圖片上的骨頭，就會看到中文、英文並聽到發音";

  }else{

    learnTab.classList.remove("active");
    gameTab.classList.add("active");

    gamePanel.style.display = "block";
    reviewArea.style.display = "none";

    instructions.textContent =
      "🎮 看題目後，直接點圖片上正確的骨頭";

    correctScore = 0;
    totalScore = 0;

    updateScore();
    nextQuestion();

  }

  clearSelectedHotspots();

}


/* ==================================================
   圖片
================================================== */

function buildViews(data){

  const holder =
    document.getElementById("viewButtons");

  holder.innerHTML = "";

  data.views.forEach((view,index)=>{

    const button =
      document.createElement("button");

    button.className =
      "view-btn" +
      (index === 0 ? " active" : "");

    button.textContent =
      view.name;

    button.onclick = function(){

      document
        .querySelectorAll(".view-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      document.getElementById("regionImage")
        .src = view.image;

    };

    holder.appendChild(button);

  });

  document.getElementById("regionImage")
    .src = data.views[0].image;

}


/* ==================================================
   點擊骨頭熱區
================================================== */

function buildHotspots(data){

  const stage =
    document.getElementById("anatomyStage");

  stage
    .querySelectorAll(".hotspot")
    .forEach(item => item.remove());

  data.bones.forEach(bone => {

    const hotspot =
      document.createElement("button");

    hotspot.className = "hotspot";

    hotspot.style.left =
      bone.x + "%";

    hotspot.style.top =
      bone.y + "%";

    hotspot.style.width =
      bone.w + "%";

    hotspot.style.height =
      bone.h + "%";

    hotspot.setAttribute(
      "aria-label",
      bone.cn + " " + bone.en
    );

    hotspot.onclick = function(){

      handleBoneClick(
        bone,
        hotspot
      );

    };

    stage.appendChild(hotspot);

  });

}


/* ==================================================
   點骨頭
================================================== */

function handleBoneClick(bone, hotspot){

  clearSelectedHotspots();

  hotspot.classList.add("selected");

  if(mode === "learn"){

    showBone(
      bone,
      true
    );

  }else{

    checkGameAnswer(
      bone,
      hotspot
    );

  }

}


/* ==================================================
   學習模式答案
================================================== */

function showBone(bone, autoSpeak=true){

  currentBone = bone;

  document.getElementById("answerCN")
    .textContent = bone.cn;

  document.getElementById("answerEN")
    .textContent = bone.en;

  document.getElementById("answerDescription")
    .textContent = bone.text;

  document.getElementById("answerBox")
    .classList.add("show");

  document.getElementById("answerSpeak")
    .onclick = function(){

      speakEnglish(
        bone.en
      );

    };

  if(autoSpeak){
    speakEnglish(
      bone.en
    );
  }

}


/* ==================================================
   複習卡
================================================== */

function buildBoneCards(data){

  const grid =
    document.getElementById("boneGrid");

  grid.innerHTML = "";

  data.bones.forEach(bone => {

    const card =
      document.createElement("div");

    card.className =
      "bone-card";

    card.innerHTML = `

      <div class="bone-card-cn">
        ${bone.cn}
      </div>

      <div class="bone-card-en">

        <span>
          ${bone.en}
        </span>

        <button
          class="mini-speak"
        >
          🔊
        </button>

      </div>
    `;

    card.onclick = function(){

      showBone(
        bone,
        true
      );

    };

    const soundButton =
      card.querySelector(".mini-speak");

    soundButton.onclick =
      function(event){

        event.stopPropagation();

        speakEnglish(
          bone.en
        );

      };

    grid.appendChild(card);

  });

}


/* ==================================================
   遊戲
================================================== */

function nextQuestion(){

  if(!currentRegionKey){
    return;
  }

  const bones =
    regions[currentRegionKey].bones;

  let newTarget;

  do{

    newTarget =
      bones[
        Math.floor(
          Math.random() * bones.length
        )
      ];

  }while(
    bones.length > 1 &&
    gameTarget &&
    newTarget.id === gameTarget.id
  );

  gameTarget =
    newTarget;

  document.getElementById("gameWord")
    .textContent =
    gameTarget.en;

  const result =
    document.getElementById("gameResult");

  result.textContent = "";
  result.className = "game-result";

  document.getElementById("answerBox")
    .classList.remove("show");

  clearSelectedHotspots();

  setTimeout(()=>{

    speakEnglish(
      gameTarget.en
    );

  },250);

}


function speakGameQuestion(){

  if(gameTarget){

    speakEnglish(
      gameTarget.en
    );

  }

}


function checkGameAnswer(
  bone,
  hotspot
){

  if(!gameTarget){
    return;
  }

  totalScore++;

  const result =
    document.getElementById("gameResult");

  if(bone.id === gameTarget.id){

    correctScore++;

    result.textContent =
      "✅ 答對了！ " +
      bone.cn +
      " / " +
      bone.en;

    result.className =
      "game-result correct";

    showBone(
      bone,
      true
    );

    updateScore();

    setTimeout(()=>{

      nextQuestion();

    },1300);

  }else{

    result.textContent =
      "❌ 再找找看～這是 " +
      bone.cn +
      " / " +
      bone.en;

    result.className =
      "game-result wrong";

    speakEnglish(
      bone.en
    );

    updateScore();

  }

}


function updateScore(){

  document.getElementById("correctScore")
    .textContent =
    correctScore;

  document.getElementById("totalScore")
    .textContent =
    totalScore;

}


/* ==================================================
   清除選取
================================================== */

function clearSelectedHotspots(){

  document
    .querySelectorAll(".hotspot")
    .forEach(item =>
      item.classList.remove("selected")
    );

}


/* ==================================================
   英文發音
================================================== */

function speakEnglish(text){

  if(
    !("speechSynthesis" in window)
  ){

    alert(
      "這個瀏覽器目前不支援語音播放。"
    );

    return;

  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang =
    "en-US";

  speech.rate =
    0.78;

  speech.pitch =
    1;

  speech.volume =
    1;

  const voices =
    window.speechSynthesis
    .getVoices();

  const englishVoice =
    voices.find(
      voice =>
      voice.lang === "en-US"
    )
    ||
    voices.find(
      voice =>
      voice.lang &&
      voice.lang.startsWith("en")
    );

  if(englishVoice){
    speech.voice =
      englishVoice;
  }

  showSpeechStatus(
    "🔊 " + text
  );

  window.speechSynthesis
    .speak(speech);

}


/* ==================================================
   語音提示
================================================== */

let speechTimer = null;

function showSpeechStatus(text){

  const box =
    document.getElementById("speechStatus");

  box.textContent =
    text;

  box.classList.add("show");

  clearTimeout(
    speechTimer
  );

  speechTimer =
    setTimeout(()=>{

      box.classList.remove("show");

    },1400);

}


/* ==================================================
   回首頁
================================================== */

function goHome(){

  if(
    "speechSynthesis" in window
  ){
    window.speechSynthesis.cancel();
  }

  document.getElementById("learningArea")
    .style.display = "none";

  document.getElementById("homeArea")
    .style.display = "block";

  document.getElementById("answerBox")
    .classList.remove("show");

  gameTarget = null;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

   iPhone Safari 聲音初始化
================================================== */

if(

){

  window.speechSynthesis
    .getVoices();

  window.speechSynthesis

      window.speechSynthesis

    };

}
