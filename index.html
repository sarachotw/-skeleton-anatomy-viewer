<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>兒童醫學骨骼學習館</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans TC",Arial,sans-serif;
  background:#f3f8fd;
  color:#243447;
}

/* 頂部 */
header{
  background:linear-gradient(135deg,#1976d2,#42a5f5);
  color:white;
  text-align:center;
  padding:36px 16px 32px;
}

header h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

header .english{
  margin-top:18px;
  font-size:22px;
}

header .subtitle{
  margin-top:16px;
  font-size:18px;
  opacity:.95;
}

/* 主內容 */
.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:25px;
  padding:28px 24px;
  margin:18px 0;
  box-shadow:0 8px 28px rgba(35,95,145,.10);
}

h2{
  margin:0 0 24px;
  color:#1565c0;
  font-size:28px;
}

/* 骨骼選單 */
.bone-list{
  display:grid;
  gap:16px;
}

.bone-btn{
  width:100%;
  min-height:125px;
  border:none;
  border-radius:25px;
  background:#e1f1fc;
  color:#0d55ad;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;

  padding:18px;
  transition:.2s;
}

.bone-btn:active{
  transform:scale(.98);
}

.bone-btn:hover{
  background:#d4ebfb;
}

/* 小型骨骼圖 */
.bone-icon{
  width:70px;
  height:70px;
  flex-shrink:0;
}

.bone-name{
  text-align:left;
}

.bone-name .zh{
  font-size:25px;
  font-weight:700;
}

.bone-name .en{
  margin-top:4px;
  font-size:23px;
}

/* 詳細資訊 */
.detail-card{
  display:none;
  margin-top:22px;
  padding:25px;
  border-radius:22px;
  background:#f5fbff;
  border:2px solid #d8ecfa;
  text-align:center;
}

.detail-card.show{
  display:block;
}

.detail-card h3{
  margin:8px 0;
  color:#1565c0;
  font-size:28px;
}

.detail-card .en-title{
  font-size:24px;
  color:#3572ad;
  margin-bottom:18px;
}

.detail-card p{
  text-align:left;
  line-height:1.8;
  font-size:18px;
  margin:10px 0;
}

/* 發音 */
.speak-btn{
  border:none;
  background:#1976d2;
  color:white;
  padding:12px 20px;
  border-radius:30px;
  font-size:17px;
  margin-top:12px;
  cursor:pointer;
}

/* 小測驗 */
.quiz-option{
  width:100%;
  border:2px solid #cfe5f6;
  background:#f5fbff;
  border-radius:18px;
  padding:16px;
  margin:8px 0;
  font-size:18px;
  color:#255f98;
  cursor:pointer;
}

.quiz-option:hover{
  background:#e6f4ff;
}

#quizResult{
  min-height:32px;
  font-size:19px;
  font-weight:700;
  margin-top:14px;
}

/* SVG 通用 */
svg{
  width:100%;
  height:100%;
}

.bone{
  fill:#fffdf8;
  stroke:#7593a8;
  stroke-width:3;
}

.bone-detail{
  fill:none;
  stroke:#7894a6;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

@media(max-width:600px){

  header{
    padding:30px 14px;
  }

  header h1{
    font-size:27px;
  }

  header .english{
    font-size:20px;
  }

  header .subtitle{
    font-size:17px;
  }

  .container{
    padding:17px;
  }

  .card{
    padding:25px 20px;
  }

  h2{
    font-size:26px;
  }

  .bone-btn{
    min-height:115px;
  }

  .bone-icon{
    width:65px;
    height:65px;
  }

  .bone-name .zh{
    font-size:23px;
  }

  .bone-name .en{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🦴 兒童醫學骨骼學習館</h1>
  <div class="english">Human Skeleton Anatomy</div>
  <div class="subtitle">點一點、聽發音、玩遊戲！</div>
</header>

<div class="container">

<!-- 第一區 -->
<section class="card">

<h2>① 認識人體骨骼</h2>

<div class="bone-list">

<!-- 頭骨 -->
<button class="bone-btn"
onclick="showBone(
'頭骨',
'Skull',
'頭骨保護我們的大腦，也形成臉部的基本構造。',
'Skull'
)">

<div class="bone-icon">
<svg viewBox="0 0 100 100">

<path class="bone"
d="
M50 8
C27 8 15 25 16 45
C17 59 24 68 33 72
L35 87
L43 92
L43 79
L57 79
L57 92
L65 87
L67 72
C76 68 83 59 84 45
C85 25 73 8 50 8Z
"/>

<circle cx="35" cy="45" r="9"
fill="#536b79"/>

<circle cx="65" cy="45" r="9"
fill="#536b79"/>

<path class="bone-detail"
d="M50 50 L45 62 L55 62 Z"/>

<path class="bone-detail"
d="M37 72 Q50 78 63 72"/>

</svg>
</div>

<div class="bone-name">
<div class="zh">頭骨</div>
<div class="en">Skull</div>
</div>

</button>


<!-- 脊椎 -->
<button class="bone-btn"
onclick="showBone(
'脊椎',
'Vertebral Column',
'脊椎由一節一節的椎骨組成，幫助我們支撐身體，也保護脊髓。',
'Vertebral Column'
)">

<div class="bone-icon">

<svg viewBox="0 0 100 100">

<path class="bone-detail"
d="M53 6
C42 18 59 27 48 38
C38 49 57 57 47 68
C37 79 51 87 47 96"
stroke-width="8"/>

<circle class="bone" cx="51" cy="16" r="7"/>
<circle class="bone" cx="49" cy="31" r="7"/>
<circle class="bone" cx="51" cy="46" r="7"/>
<circle class="bone" cx="49" cy="61" r="7"/>
<circle class="bone" cx="49" cy="76" r="7"/>
<circle class="bone" cx="48" cy="90" r="6"/>

</svg>

</div>

<div class="bone-name">
<div class="zh">脊椎</div>
<div class="en">Vertebral Column</div>
</div>

</button>


<!-- 肋骨 -->
<button class="bone-btn"
onclick="showBone(
'肋骨',
'Ribs',
'肋骨形成胸廓，可以保護心臟與肺部。',
'Ribs'
)">

<div class="bone-icon">

<svg viewBox="0 0 100 100">

<path class="bone-detail"
d="M50 13 L50 87"
stroke-width="6"/>

<path class="bone-detail"
d="M47 24
C26 22 16 31 19 43
C22 52 31 55 47 57"/>

<path class="bone-detail"
d="M53 24
C74 22 84 31 81 43
C78 52 69 55 53 57"/>

<path class="bone-detail"
d="M47 37
C27 36 20 45 23 55
C27 65 36 67 47 68"/>

<path class="bone-detail"
d="M53 37
C73 36 80 45 77 55
C73 65 64 67 53 68"/>

<path class="bone-detail"
d="M47 51
C31 52 27 61 31 69
C35 77 41 79 47 79"/>

<path class="bone-detail"
d="M53 51
C69 52 73 61 69 69
C65 77 59 79 53 79"/>

</svg>

</div>

<div class="bone-name">
<div class="zh">肋骨</div>
<div class="en">Ribs</div>
</div>

</button>


<!-- 胸骨 -->
<button class="bone-btn"
onclick="showBone(
'胸骨',
'Sternum',
'胸骨位在胸口中央，與肋骨一起形成胸廓。',
'Sternum'
)">

<div class="bone-icon">

<svg viewBox="0 0 100 100">

<path class="bone"
d="
M43 10
Q50 5 57 10
L61 25
L57 32
L59 72
L53 91
Q50 97 47 91
L41 72
L43 32
L39 25
Z"/>

</svg>

</div>

<div class="bone-name">
<div class="zh">胸骨</div>
<div class="en">Sternum</div>
</div>

</button>


<!-- 肱骨 -->
<button class="bone-btn"
onclick="showBone(
'肱骨',
'Humerus',
'肱骨是上臂的長骨，連接肩膀與手肘。',
'Humerus'
)">

<div class="bone-icon">

<svg viewBox="0 0 100 100">

<g transform="rotate(20 50 50)">

<circle class="bone"
cx="49"
cy="15"
r="13"/>

<path class="bone"
d="
M42 23
Q40 42 43 67
L37 80
Q34 90 42 94
Q48 96 51 87
Q54 96 61 93
Q68 90 63 81
L56 67
Q59 42 57 23
Z"/>

</g>

</svg>

</div>

<div class="bone-name">
<div class="zh">肱骨</div>
<div class="en">Humerus</div>
</div>

</button>

</div>


<!-- 點選後的資訊 -->
<div id="boneDetail" class="detail-card">

<h3 id="boneZh"></h3>

<div
id="boneEn"
class="en-title">
</div>

<p id="boneText"></p>

<button
class="speak-btn"
onclick="speakCurrent()">
🔊 聽英文發音
</button>

</div>

</section>


<!-- 第二區 -->
<section class="card">

<h2>② 骨骼小知識</h2>

<p style="font-size:18px;line-height:1.8;">
人體的骨骼就像身體裡的支架，
除了支撐身體，也可以保護重要器官。
</p>

<p style="font-size:18px;line-height:1.8;">
成年人大約有
<strong>206 塊骨頭</strong>。
孩子在成長過程中，
部分骨頭會慢慢融合在一起。
</p>

</section>


<!-- 第三區 -->
<section class="card">

<h2>③ 骨骼小測驗</h2>

<p style="font-size:20px;font-weight:700;">
哪一個骨骼主要負責保護大腦？
</p>

<button
class="quiz-option"
onclick="checkAnswer(false)">
脊椎 Vertebral Column
</button>

<button
class="quiz-option"
onclick="checkAnswer(true)">
頭骨 Skull
</button>

<button
class="quiz-option"
onclick="checkAnswer(false)">
肱骨 Humerus
</button>

<div id="quizResult"></div>

</section>

</div>


<script>

let currentEnglish="";

function showBone(zh,en,text,speak){

  document.getElementById("boneZh").textContent=zh;

  document.getElementById("boneEn").textContent=en;

  document.getElementById("boneText").textContent=text;

  document.getElementById("boneDetail")
  .classList.add("show");

  currentEnglish=speak;

  document.getElementById("boneDetail")
  .scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


function speakCurrent(){

  if(!currentEnglish) return;

  window.speechSynthesis.cancel();

  const speech=
  new SpeechSynthesisUtterance(currentEnglish);

  speech.lang="en-US";

  speech.rate=0.8;

  window.speechSynthesis.speak(speech);

}


function checkAnswer(correct){

  const result=
  document.getElementById("quizResult");

  if(correct){

    result.textContent=
    "🎉 答對了！頭骨 Skull 可以保護我們的大腦！";

    result.style.color="#16833b";

  }else{

    result.textContent=
    "再想想看～哪一塊骨頭包住我們的大腦呢？";

    result.style.color="#d66a00";

  }

}

</script>

</body>
</html>
