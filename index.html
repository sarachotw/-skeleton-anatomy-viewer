<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兒童醫學骨骼學習館</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#f4f9ff;
  color:#243447;
}

header{
  background:linear-gradient(135deg,#1976d2,#42a5f5);
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
  color:#1565c0;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:17px;
  cursor:pointer;
}

.menu button{
  background:#e3f2fd;
  color:#0d47a1;
}

.menu button:hover{
  background:#bbdefb;
}

.info{
  background:#fff8e1;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  text-align:center;
}

.bone-name{
  font-size:25px;
  font-weight:bold;
  color:#e65100;
}

.english{
  font-size:19px;
  color:#1565c0;
  margin-top:5px;
}

.speak{
  background:#4caf50;
  color:white;
  margin:5px;
}

.game-btn{
  background:#ff9800;
  color:white;
}

.next-btn{
  background:#1976d2;
  color:white;
}

svg{
  width:100%;
  max-width:500px;
  display:block;
  margin:auto;
}

.bone{
  stroke:#555;
  stroke-width:2;
  cursor:pointer;
  transition:.2s;
}

.bone:hover{
  opacity:.7;
  stroke:#ff9800;
  stroke-width:4;
}

#skullSection{
  display:none;
}

#gameSection{
  display:none;
}

.game-question{
  background:#e8f5e9;
  border-radius:15px;
  padding:15px;
  text-align:center;
  font-size:20px;
  margin-bottom:15px;
}

.correct{
  color:#2e7d32;
  font-weight:bold;
  font-size:20px;
}

.wrong{
  color:#c62828;
  font-weight:bold;
  font-size:20px;
}

.score{
  font-size:18px;
  margin-top:10px;
}

.legend{
  font-size:14px;
  color:#666;
  text-align:center;
  margin-top:10px;
}

@media(max-width:600px){
  .menu{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
<h1>🦴 兒童醫學骨骼學習館</h1>
<p>Human Skeleton Anatomy</p>
<p>點一點、聽發音、玩遊戲！</p>
</header>

<div class="container">

<div class="card">

<h2>① 認識人體骨骼</h2>

<div class="menu">

<button onclick="showBone('頭骨','Skull')">
💀 頭骨<br>Skull
</button>

<button onclick="showBone('脊椎','Vertebral column')">
🦴 脊椎<br>Vertebral Column
</button>

<button onclick="showBone('肋骨','Ribs')">
🫁 肋骨<br>Ribs
</button>

<button onclick="showBone('胸骨','Sternum')">
🦴 胸骨<br>Sternum
</button>

<button onclick="showBone('肱骨','Humerus')">
💪 肱骨<br>Humerus
</button>

<button onclick="showBone('橈骨','Radius')">
🦴 橈骨<br>Radius
</button>

<button onclick="showBone('尺骨','Ulna')">
🦴 尺骨<br>Ulna
</button>

<button onclick="showBone('骨盆','Pelvis')">
🦴 骨盆<br>Pelvis
</button>

<button onclick="showBone('股骨','Femur')">
🦵 股骨<br>Femur
</button>

<button onclick="showBone('髕骨','Patella')">
🦵 髕骨<br>Patella
</button>

<button onclick="showBone('脛骨','Tibia')">
🦴 脛骨<br>Tibia
</button>

<button onclick="showBone('腓骨','Fibula')">
🦴 腓骨<br>Fibula
</button>

</div>

<div class="info">

<div id="mainChinese" class="bone-name">
請選擇一個骨頭
</div>

<div id="mainEnglish" class="english">
Choose a bone
</div>

<br>

<button class="speak" onclick="speakChinese()">
🔊 中文發音
</button>

<button class="speak" onclick="speakEnglish()">
🔊 English
</button>

</div>

<br>

<button class="next-btn" onclick="openSkull()">
💀 進入頭骨解剖
</button>

</div>

</div>

<div class="info">

<div id="skullChinese" class="bone-name">
點一塊頭骨看看
</div>

<div id="skullEnglish" class="english">
Tap a bone
</div>

<br>

<button class="speak" onclick="speakSkullChinese()">
🔊 中文
</button>

<button class="speak" onclick="speakSkullEnglish()">
🔊 English
</button>

</div>

<br>

<button class="game-btn" onclick="startGame()">
🎮 開始找骨頭遊戲
</button>

</div>


<!-- 遊戲 -->

<div class="card" id="gameSection">

<h2>③ 骨頭小醫生挑戰 🎮</h2>

<div class="game-question">

請指出：

<div id="questionCN"
style="font-size:27px;font-weight:bold;margin-top:8px">
額骨
</div>

<div id="questionEN"
style="font-size:20px;color:#1565c0">
Frontal bone
</div>

</div>

<p style="text-align:center">
👆 回到上面的頭骨圖，點你認為正確的位置！
</p>

<div id="result" style="text-align:center"></div>

<div class="score" style="text-align:center">
⭐ 分數：
<span id="score">0</span>
</div>

<br>

<div style="text-align:center">
<button class="next-btn" onclick="nextQuestion()">
下一題 ➜
</button>
</div>

</div>

</div>


<script>

let currentChinese="";
let currentEnglish="";

let skullChinese="";
let skullEnglish="";

function showBone(cn,en){

currentChinese=cn;
currentEnglish=en;

document.getElementById("mainChinese").innerText=cn;
document.getElementById("mainEnglish").innerText=en;

}

function speak(text,lang){

if(!text)return;

speechSynthesis.cancel();

let msg=new SpeechSynthesisUtterance(text);
msg.lang=lang;
msg.rate=0.85;

speechSynthesis.speak(msg);

}

function speakChinese(){

if(currentChinese){
speak(currentChinese,"zh-TW");
}

}

function speakEnglish(){

if(currentEnglish){
speak(currentEnglish,"en-US");
}

}

function openSkull(){

document.getElementById("skullSection").style.display="block";

document.getElementById("skullSection")
.scrollIntoView({behavior:"smooth"});

}

function speakSkullChinese(){

speak(skullChinese,"zh-TW");

}

function speakSkullEnglish(){

speak(skullEnglish,"en-US");

}


// 頭骨點擊

document.querySelectorAll(".bone").forEach(function(bone){

bone.addEventListener("click",function(){

let cn=this.dataset.cn;
let en=this.dataset.en;

skullChinese=cn;
skullEnglish=en;

document.getElementById("skullChinese").innerText=cn;
document.getElementById("skullEnglish").innerText=en;

speak(cn,"zh-TW");

setTimeout(function(){
speak(en,"en-US");
},700);

checkGame(cn);

});

});


// 遊戲

const questions=[

{
cn:"額骨",
en:"Frontal bone"
},

{
cn:"頂骨",
en:"Parietal bone"
},

{
cn:"顳骨",
en:"Temporal bone"
},

{
cn:"枕骨",
en:"Occipital bone"
},

{
cn:"鼻骨",
en:"Nasal bone"
},

{
cn:"顴骨",
en:"Zygomatic bone"
},

{
cn:"上頜骨",
en:"Maxilla"
},

{
cn:"下頜骨",
en:"Mandible"
}

];

let currentQuestion=null;
let gameActive=false;
let score=0;

function startGame(){

gameActive=true;
score=0;

document.getElementById("score").innerText=score;

document.getElementById("gameSection").style.display="block";

nextQuestion();

document.getElementById("gameSection")
.scrollIntoView({behavior:"smooth"});

}

function nextQuestion(){

currentQuestion=
questions[Math.floor(Math.random()*questions.length)];

document.getElementById("questionCN")
.innerText=currentQuestion.cn;

document.getElementById("questionEN")
.innerText=currentQuestion.en;

document.getElementById("result").innerHTML="";

speak("請找出"+currentQuestion.cn,"zh-TW");

}

function checkGame(selected){

if(!gameActive || !currentQuestion)return;

if(selected===currentQuestion.cn){

score++;

document.getElementById("score").innerText=score;

document.getElementById("result").innerHTML=
"<div class='correct'>🎉 答對了！Excellent!</div>";

speak("答對了","zh-TW");

}else{

document.getElementById("result").innerHTML=
"<div class='wrong'>再找找看 😊 Try again!</div>";

speak("再找找看","zh-TW");

}

}

</script>

</body>
</html>
